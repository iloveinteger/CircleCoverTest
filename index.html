<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3-Circle Cover</title>
<style>
  :root{--bg:#f4f4f8;--fg:#17171c;--card:#fff;--line:#e3e3ea;--acc:#4f46e5;--mut:#7a7a88;--on:#fff;--shadow:0 6px 24px rgba(30,30,60,.08)}
  @media (prefers-color-scheme:dark){:root{--bg:#0f0f14;--fg:#f1f1f6;--card:#1a1a22;--line:#2b2b36;--acc:#6366f1;--mut:#9a9aab;--on:#fff;--shadow:0 6px 24px rgba(0,0,0,.4)}}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;height:100dvh;background:var(--bg);color:var(--fg);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
  body{display:flex;flex-direction:column;max-width:900px;margin:0 auto}
  html,body{touch-action:manipulation}
  button{font:inherit;color:var(--fg);cursor:pointer;border:0;background:none;padding:0;touch-action:manipulation;-webkit-user-select:none;user-select:none}
  .hidden{display:none!important}

  #top{display:flex;align-items:center;gap:10px;padding:12px 14px 8px}
  .ib{width:38px;height:38px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:18px;box-shadow:var(--shadow);flex:none}
  #title{font-weight:700;font-size:18px;letter-spacing:-.01em}
  .chips{margin-left:auto;display:flex;gap:6px}
  .chip{padding:6px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
  #tt{min-width:64px;text-align:center;color:var(--acc)}
  #tbar{height:5px;margin:0 16px 8px;background:var(--line);border-radius:3px;overflow:hidden}
  #tfill{display:block;height:100%;width:100%;background:var(--acc);border-radius:3px}

  #wrap{flex:1;min-height:200px;margin:0 12px;position:relative;border-radius:20px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow);
        background:var(--card);background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:22px 22px}
  canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;background:transparent}
  #stats{position:absolute;top:12px;left:12px;display:flex;gap:6px;align-items:center;pointer-events:none}
  .pill{padding:6px 12px;border-radius:999px;background:var(--bg);border:1px solid var(--line);font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
  .pill.sub{font-weight:500;color:var(--mut)}
  #cov.ok{background:var(--acc);border-color:var(--acc);color:var(--on)}
  #hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);padding:8px 16px;border-radius:999px;background:var(--fg);color:var(--bg);font-size:13px;white-space:nowrap;pointer-events:none;opacity:.9}

  #dock{display:flex;gap:10px;justify-content:center;padding:12px 12px max(16px,env(safe-area-inset-bottom))}
  .btn{flex:1;max-width:220px;padding:13px 16px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:15px;box-shadow:var(--shadow);transition:transform .08s,opacity .15s}
  .btn:active{transform:scale(.97)}
  .btn.p{background:var(--acc);border-color:var(--acc);color:var(--on)}
  .btn:disabled{opacity:.4;box-shadow:none}

  .ov{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:5;text-align:center;padding:24px}
  #menu h1{margin:0;font-size:32px;letter-spacing:-.02em;color:var(--fg)}
  #menu .sub{margin:0 0 14px;color:var(--mut);font-size:15px}
  .card{width:min(360px,100%);display:flex;gap:14px;align-items:center;padding:16px;text-align:left;border-radius:18px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);transition:transform .1s}
  .card:active{transform:scale(.98)}
  .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-style:normal;background:var(--bg);color:var(--acc);flex:none}
  .card b{display:block;font-size:17px;margin-bottom:3px}
  .card span{font-size:13px;color:var(--mut);line-height:1.4}
  .badge{display:inline-block;margin-top:6px;padding:2px 10px;border-radius:999px;background:var(--bg);font-weight:600;color:var(--acc)!important}
  #best:empty{display:none}

  #over{inset:auto 0 0 0;background:var(--card);border-top:1px solid var(--line);border-radius:22px 22px 0 0;padding:18px 20px max(20px,env(safe-area-inset-bottom));gap:10px;box-shadow:0 -10px 40px rgba(0,0,0,.2)}
  #over h1{font-size:22px;margin:0}
  #overTxt{font-size:15px;line-height:1.6;color:var(--mut)}
  #toast{position:fixed;left:50%;top:30%;transform:translate(-50%,-8px);padding:12px 26px;border-radius:999px;background:var(--acc);color:var(--on);font-size:17px;font-weight:700;letter-spacing:.01em;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .2s,transform .2s;z-index:4}
  #toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<header id="top">
  <button id="bMenu" class="ib" aria-label="Back to menu"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
  <div id="title"></div>
  <div class="chips"><span id="lv" class="chip hidden"></span><span id="tt" class="chip hidden"></span></div>
</header>
<div id="tbar" class="hidden"><i id="tfill"></i></div>
<div id="wrap">
  <canvas id="cv"></canvas>
  <div id="stats" class="hidden"><span id="cov" class="pill"></span><span id="rad" class="pill sub"></span></div>
  <div id="hint" class="hidden"></div>
</div>
<div id="dock">
  <button id="bClear" class="btn">Redraw</button>
  <button id="bConfirm" class="btn p">Close shape</button>
  <button id="bNext" class="btn">Next shape</button>
  <button id="bSolve" class="btn p" disabled>Solve</button>
</div>

<div id="menu" class="ov">
  <h1>3-Circle Cover</h1>
  <p class="sub">Cover any shape with three equal circles</p>
  <button class="card" id="mFree"><i class="ic"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg></i><div><b>Freehand</b><span>Draw your own shape and find the smallest radius that covers it</span></div></button>
  <button class="card" id="mRush"><i class="ic"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9z"/></svg></i><div><b>Time Attack</b><span>Cover 100% before time runs out. Every level is faster and tighter</span><span id="best" class="badge"></span></div></button>
  <button class="card" id="mZen"><i class="ic"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19c0-9 5-14 14-14 0 9-5 14-14 14z"/><path d="M5 19l8-8"/></svg></i><div><b>Zen</b><span>Random shapes, no timer. Relax and take your time</span></div></button>
</div>
<div id="over" class="ov hidden">
  <h1>Time's up</h1>
  <div id="overTxt"></div>
  <div style="display:flex;gap:10px;width:100%;justify-content:center">
    <button class="btn p" id="oRetry">Try again</button>
    <button class="btn" id="oMenu">Menu</button>
  </div>
</div>
<div id="toast"></div>

<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
let W=0,H=0,dpr=1;
let stroke=[],poly=null,inside=[],R=0,circles=[],solved=null,drag=null,anim=null;
let mode='free',phase='idle',level=1,score=0,deadline=0,limit=0,timerId=null,cleared=false;
const mask=document.createElement('canvas'),mctx=mask.getContext('2d');

function resize(){
  dpr=window.devicePixelRatio||1;
  const r=cv.getBoundingClientRect();W=r.width;H=r.height;
  cv.width=W*dpr;cv.height=H*dpr;mask.width=cv.width;mask.height=cv.height;
  if(poly)setupQ();
  draw();
}
addEventListener('resize',resize);

/* ================= geometry ================= */
function pip(x,y,P){let c=false;for(let i=0,j=P.length-1;i<P.length;j=i++){
  const a=P[i],b=P[j];
  if((a.y>y)!==(b.y>y)&&x<(b.x-a.x)*(y-a.y)/(b.y-a.y)+a.x)c=!c;}return c;}
const d2=(a,b)=>(a.x-b.x)**2+(a.y-b.y)**2;
function c2(a,b){return{x:(a.x+b.x)/2,y:(a.y+b.y)/2,r:Math.sqrt(d2(a,b))/2}}
function c3(a,b,c){
  const A=b.x-a.x,B=b.y-a.y,C=c.x-a.x,D=c.y-a.y,E=A*(a.x+b.x)+B*(a.y+b.y),F=C*(a.x+c.x)+D*(a.y+c.y),G=2*(A*(c.y-b.y)-B*(c.x-b.x));
  if(Math.abs(G)<1e-9){const s=[c2(a,b),c2(a,c),c2(b,c)];return s.sort((p,q)=>q.r-p.r)[0];}
  const x=(D*E-B*F)/G,y=(A*F-C*E)/G;return{x,y,r:Math.sqrt((x-a.x)**2+(y-a.y)**2)};
}
const inC=(c,p)=>c&&Math.sqrt((p.x-c.x)**2+(p.y-c.y)**2)<=c.r+1e-7;
/* Welzl: minimum enclosing circle */
function mec(P){
  P=P.slice();for(let i=P.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[P[i],P[j]]=[P[j],P[i]];}
  let c=null;
  for(let i=0;i<P.length;i++)if(!inC(c,P[i])){
    c={x:P[i].x,y:P[i].y,r:0};
    for(let j=0;j<i;j++)if(!inC(c,P[j])){
      c=c2(P[i],P[j]);
      for(let k=0;k<j;k++)if(!inC(c,P[k]))c=c3(P[i],P[j],P[k]);
    }
  }
  return c||{x:0,y:0,r:0};
}

/* ================= 3-center solver ================= */
function solve3(P){
  let best=null;const all=[];
  for(let t=0;t<12;t++){
    let cs=[P[Math.random()*P.length|0]];
    while(cs.length<3){
      let far=null,fd=-1;
      for(let n=0;n<40;n++){const p=P[Math.random()*P.length|0];
        const m=Math.min(...cs.map(c=>d2(c,p)));if(m>fd){fd=m;far=p}}
      cs.push(far);
    }
    cs=cs.map(c=>({x:c.x,y:c.y,r:0}));
    let prev=1e18;
    for(let it=0;it<20;it++){
      const cl=[[],[],[]];
      for(const p of P){let bi=0,bd=1e18;
        for(let i=0;i<3;i++){const d=d2(cs[i],p);if(d<bd){bd=d;bi=i}}cl[bi].push(p);}
      cs=cl.map((g,i)=>g.length?mec(g):cs[i]);
      const m=Math.max(...cs.map(c=>c.r));
      if(Math.abs(prev-m)<1e-4)break;prev=m;
    }
    const m=Math.max(...cs.map(c=>c.r));
    all.push({r:m,cs:cs.map(c=>({x:c.x,y:c.y}))});
  }
  all.sort((a,b)=>a.r-b.r);
  for(const a of all.slice(0,4)){
    const cs=shrink(a.cs,P),v=cover(cs,P);
    if(!best||v<best.v)best={v,cs};
  }
  return best;
}
function cover(cs,P){let m=0;
  for(const p of P){let d=1e18;
    for(const c of cs){const e=(p.x-c.x)**2+(p.y-c.y)**2;if(e<d)d=e;}
    if(d>m)m=d;}
  return m;}
/* Fast shrink: lower the target radius step by step; every point farther than the target
   pulls its nearest center toward itself (all 3 centers move together). Typed arrays, early fail. */
function shrink(cs,P,fmin=3e-4){
  const n=P.length,px=new Float64Array(n),py=new Float64Array(n);
  for(let i=0;i<n;i++){px[i]=P[i].x;py[i]=P[i].y;}
  const cx=Float64Array.from(cs,c=>c.x),cy=Float64Array.from(cs,c=>c.y);
  const tx=new Float64Array(3),ty=new Float64Array(3),gx=new Float64Array(3),gy=new Float64Array(3),m=new Int32Array(3);
  const cov=(x,y)=>{let mx=0;for(let i=0;i<n;i++){const a=px[i],b=py[i];
    let d=(a-x[0])**2+(b-y[0])**2,e=(a-x[1])**2+(b-y[1])**2;if(e<d)d=e;e=(a-x[2])**2+(b-y[2])**2;if(e<d)d=e;if(d>mx)mx=d;}return Math.sqrt(mx);};
  let r=cov(cx,cy),f=0.02;
  while(f>fmin){
    const rt=r*(1-f);tx.set(cx);ty.set(cy);
    let ok=false,mark=1e18;
    for(let it=0;it<120;it++){
      gx.fill(0);gy.fill(0);m.fill(0);let mx=0;
      for(let i=0;i<n;i++){const a=px[i],b=py[i];
        let bi=0,bd=(a-tx[0])**2+(b-ty[0])**2,e=(a-tx[1])**2+(b-ty[1])**2;
        if(e<bd){bd=e;bi=1}e=(a-tx[2])**2+(b-ty[2])**2;if(e<bd){bd=e;bi=2}
        const d=Math.sqrt(bd);if(d>mx)mx=d;
        if(d>rt){const w=(d-rt)/d;gx[bi]+=w*(a-tx[bi]);gy[bi]+=w*(b-ty[bi]);m[bi]++;}
      }
      if(mx<=rt+0.02){ok=true;break;}
      if(it%15===14){if(mark-mx<2e-3*rt)break;mark=mx;}   // stalled -> fail early
      for(let i=0;i<3;i++)if(m[i]){tx[i]+=0.5*gx[i]/m[i];ty[i]+=0.5*gy[i]/m[i];}
    }
    if(ok){cx.set(tx);cy.set(ty);r=cov(cx,cy);}else f/=2;
  }
  return [0,1,2].map(i=>({x:cx[i],y:cy[i]}));
}
/* Partition local search: move extreme points of the bottleneck cluster to another cluster
   (exact minimum enclosing circle each time). Lets a slack circle take work from the others. */
function partSearch(P,cs){
  const g=[[],[],[]];
  for(const p of P){let bi=0,bd=1e18;for(let i=0;i<3;i++){const d=d2(cs[i],p);if(d<bd){bd=d;bi=i}}g[bi].push(p);}
  const rad=g.map((a,i)=>a.length?mec(a):{x:cs[i].x,y:cs[i].y,r:0});
  const key=rr=>rr.map(c=>c.r).sort((a,b)=>b-a);
  const less=(a,b)=>{for(let i=0;i<3;i++){if(a[i]<b[i]-1e-9)return true;if(a[i]>b[i]+1e-9)return false;}return false;};
  let curK=key(rad);
  for(let it=0;it<80;it++){
    let b=0;for(let i=1;i<3;i++)if(rad[i].r>rad[b].r)b=i;
    const cb=rad[b];
    const cand=g[b].map(p=>[d2(p,cb),p]).sort((x,y)=>y[0]-x[0]).slice(0,6).map(x=>x[1]);
    let best=null,bestK=curK;
    const tryMove=(pts,j)=>{
      const nb=g[b].filter(p=>!pts.includes(p));if(!nb.length)return;
      const cb2=mec(nb),cj2=mec(g[j].concat(pts));
      const k=key([0,1,2].map(i=>i===b?cb2:i===j?cj2:rad[i]));
      if(less(k,bestK)){bestK=k;best={pts,j,cb2,cj2};}
    };
    for(const p of cand)for(let j=0;j<3;j++)if(j!==b)tryMove([p],j);
    if(!best)for(let a=0;a<cand.length;a++)for(let c=a+1;c<cand.length;c++)for(let j=0;j<3;j++)if(j!==b)tryMove([cand[a],cand[c]],j);
    if(!best)break;
    g[b]=g[b].filter(p=>!best.pts.includes(p));g[best.j]=g[best.j].concat(best.pts);
    rad[b]=best.cb2;rad[best.j]=best.cj2;curK=bestK;
  }
  return rad.map(c=>({x:c.x,y:c.y}));
}
/* The solver works on a subsample. Find full-set points it left uncovered, add the worst
   ones to the working set, and shrink again (constraint generation). */
function refineFull(cs,P,full){
  P=P.slice();cs=partSearch(P,cs);
  for(let it=0;it<4;it++){
    const thr=cover(cs,P)*(1+2e-4),bad=[];
    for(const p of full){let d=1e18;
      for(const c of cs){const e=(p.x-c.x)**2+(p.y-c.y)**2;if(e<d)d=e;}
      if(d>thr)bad.push([d,p]);}
    if(!bad.length)break;
    bad.sort((a,b)=>b[0]-a[0]);
    for(const b of bad.slice(0,150))P.push(b[1]);
    cs=shrink(cs,P);cs=partSearch(P,cs);
  }
  return cs;
}

/* ================= pixel-based coverage measure ================= */
const Q=0.5,mc=document.createElement('canvas');let qctx=null,totalPx=1;
function setupQ(){
  mc.width=Math.ceil(W*Q);mc.height=Math.ceil(H*Q);
  qctx=mc.getContext('2d',{willReadFrequently:true});
  qctx.setTransform(Q,0,0,Q,0,0);qctx.clearRect(0,0,W,H);
  qctx.fillStyle='#f00';path(qctx,poly,true);qctx.fill('evenodd');
  totalPx=Math.max(1,countA());
}
function countA(){
  const d=qctx.getImageData(0,0,mc.width,mc.height).data;let n=0;
  for(let i=3;i<d.length;i+=4)if(d[i]>100)n++;
  return n;
}
function uncoveredPx(cs,r){
  qctx.setTransform(Q,0,0,Q,0,0);qctx.globalCompositeOperation='source-over';
  qctx.clearRect(0,0,W,H);qctx.fillStyle='#f00';path(qctx,poly,true);qctx.fill('evenodd');
  qctx.globalCompositeOperation='destination-out';qctx.fillStyle='#000';
  for(const c of cs){qctx.beginPath();qctx.arc(c.x,c.y,r,0,7);qctx.fill();}
  qctx.globalCompositeOperation='source-over';
  return countA();
}

/* ================= prepare: from poly -> optimal circles (slack = extra radius ratio) ================= */
function prepare(slack){
  setupQ();                                   // rasterize polygon once
  const d=qctx.getImageData(0,0,mc.width,mc.height).data;
  inside=[];                                  // interior points read straight from pixels
  for(let y=0;y<mc.height;y++)for(let x=0;x<mc.width;x++)
    if(d[(y*mc.width+x)*4+3]>100)inside.push({x:(x+0.5)/Q,y:(y+0.5)/Q});
  if(inside.length<20){poly=null;return false;}
  const Pb=[];
  for(let i=0;i<poly.length;i++){
    const a=poly[i],b=poly[(i+1)%poly.length],n=Math.max(1,Math.ceil(Math.hypot(b.x-a.x,b.y-a.y)/2));
    for(let t=0;t<n;t++)Pb.push({x:a.x+(b.x-a.x)*t/n,y:a.y+(b.y-a.y)*t/n});
  }
  const k=Math.ceil(inside.length/150),kb=Math.ceil(Pb.length/400);
  const P=inside.filter((_,i)=>i%k===0).concat(Pb.filter((_,i)=>i%kb===0));
  const full=inside.concat(Pb);
  solved=refineFull(solve3(P).cs,P,full);
  R=Math.sqrt(cover(solved,full))+0.05;
  if(uncoveredPx(solved,R)>0){                // pixel check: grow with doubling steps, then bisect
    let lo=R,step=0.25,hi=R+step;
    while(uncoveredPx(solved,hi)>0&&step<R){lo=hi;step*=2;hi+=step;}
    for(let n=0;n<5;n++){const mid=(lo+hi)/2;if(uncoveredPx(solved,mid)>0)lo=mid;else hi=mid;}
    R=hi;
  }
  R*=1+slack;
  circles=[.2,.5,.8].map(f=>({x:W*f,y:H-R*0.6}));
  drag=null;anim=null;
  return true;
}

/* ================= random shapes ================= */
function randomShape(lv){
  const m=Math.min(6,2+(lv>>1)),amp=Math.min(0.7,0.25+0.04*lv);
  const ks=[],ph=[],am=[];
  for(let k=1;k<=m+1;k++){ks.push(k);ph.push(Math.random()*6.283);am.push(Math.random()*amp/Math.pow(k,0.6));}
  const sx=0.7+Math.random()*0.8,rot=Math.random()*6.283,N=140,pts=[];
  for(let i=0;i<N;i++){
    const a=i/N*6.283;let r=1;
    for(let j=0;j<ks.length;j++)r+=am[j]*Math.cos(ks[j]*a+ph[j]);
    r=Math.max(0.25,r);
    const x=r*Math.cos(a)*sx,y=r*Math.sin(a);
    pts.push({x:x*Math.cos(rot)-y*Math.sin(rot),y:x*Math.sin(rot)+y*Math.cos(rot)});
  }
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const p of pts){x0=Math.min(x0,p.x);y0=Math.min(y0,p.y);x1=Math.max(x1,p.x);y1=Math.max(y1,p.y);}
  const sc=Math.min(W*0.84/(x1-x0),H*0.6/(y1-y0)),cx=(x0+x1)/2,cy=(y0+y1)/2;
  return pts.map(p=>({x:W/2+(p.x-cx)*sc,y:H*0.44+(p.y-cy)*sc}));
}

/* ================= input ================= */
function pos(e){const b=cv.getBoundingClientRect();return{x:e.clientX-b.left,y:e.clientY-b.top}}
cv.addEventListener('pointerdown',e=>{
  cv.setPointerCapture(e.pointerId);const p=pos(e);
  if(phase==='draw'){stroke=[p];draw();}
  else if(phase==='play'&&!anim){
    for(let i=circles.length-1;i>=0;i--)if(Math.hypot(p.x-circles[i].x,p.y-circles[i].y)<=R){
      drag={i,dx:p.x-circles[i].x,dy:p.y-circles[i].y};
      circles.push(circles.splice(i,1)[0]);drag.i=circles.length-1;break;}
  }
});
cv.addEventListener('pointermove',e=>{
  const p=pos(e);
  if(phase==='draw'&&stroke.length&&e.buttons){
    const evs=e.getCoalescedEvents?e.getCoalescedEvents():[];
    for(const ev of (evs.length?evs:[e])){const q=pos(ev),l=stroke[stroke.length-1];if(Math.hypot(q.x-l.x,q.y-l.y)>2)stroke.push(q);}
    draw();
  }else if(drag&&phase==='play'){circles[drag.i].x=p.x-drag.dx;circles[drag.i].y=p.y-drag.dy;draw();}
});
const up=e=>{
  if(phase==='draw'&&stroke.length&&e&&e.clientX!==undefined){const q=pos(e),l=stroke[stroke.length-1];if(Math.hypot(q.x-l.x,q.y-l.y)>0.5)stroke.push(q);draw();}
  drag=null;
};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);

/* ================= modes ================= */
const best=()=>{try{return+localStorage.getItem('rushBest')||0}catch(e){return 0}};
const setBest=v=>{try{localStorage.setItem('rushBest',v)}catch(e){}};
const show=(id,on)=>$(id).classList.toggle('hidden',!on);
function toast(t,ms){const el=$('toast');el.textContent=t;el.classList.add('show');if(ms)setTimeout(()=>el.classList.remove('show'),ms);}
function stopTimer(){clearInterval(timerId);timerId=null;}
function resetState(){
  stopTimer();stroke=[];poly=null;inside=[];circles=[];solved=null;anim=null;drag=null;cleared=false;
  $('toast').classList.remove('show');$('bSolve').disabled=true;show('stats',false);info('');
}
function openMenu(){
  stopTimer();phase='idle';show('over',false);show('menu',true);
  $('best').textContent=best()?`Best: Level ${best()}`:'';
}
function enterMode(m){
  mode=m;resetState();show('menu',false);show('over',false);
  show('bConfirm',m==='free');show('bClear',m==='free');
  show('bSolve',m!=='rush');show('bNext',m==='zen');
  show('tt',m==='rush');show('tbar',m==='rush');show('lv',m==='rush');show('dock',m!=='rush');
  $('title').textContent={free:'Freehand',rush:'Time Attack',zen:'Zen'}[m];
  resize();
  if(m==='free'){phase='draw';info('Draw any shape on the canvas');draw();}
  else if(m==='rush'){level=1;score=0;startLevel();}
  else{nextZen();}
}
$('mFree').onclick=()=>enterMode('free');
$('mRush').onclick=()=>enterMode('rush');
$('mZen').onclick=()=>enterMode('zen');
$('bMenu').onclick=openMenu;
$('oRetry').onclick=()=>enterMode('rush');
$('oMenu').onclick=openMenu;

/* ---- free ---- */
function confirmShape(){
  if(phase!=='draw')return;
  if(stroke.length<3){info('Draw a shape first');return;}
  poly=stroke.slice();phase='wait';info('Computing optimal radius…');
  // show the closed shape right away so the press visibly registers
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);ctx.fillStyle=rgba(ACC(),.5);path(ctx,poly,true);ctx.fill('evenodd');
  setTimeout(()=>{
    if(!prepare(0)){info('Shape is too small');phase='draw';return;}
    phase='play';$('bSolve').disabled=false;draw();
  },30);
}
$('bConfirm').addEventListener('pointerdown',e=>{e.preventDefault();confirmShape();});
$('bConfirm').onclick=confirmShape;
$('bClear').onclick=()=>{resetState();phase='draw';info('Draw any shape on the canvas');draw();};

/* ---- zen ---- */
function nextZen(){
  phase='wait';info('Generating shape…');$('bSolve').disabled=true;
  setTimeout(()=>{
    do{poly=randomShape(1+Math.random()*8|0);}while(!prepare(0.03));
    phase='play';cleared=false;$('bSolve').disabled=false;draw();
  },20);
}
$('bNext').onclick=()=>{if(phase==='play'||phase==='wait')nextZen();};

/* ---- rush ---- */
const timeFor=l=>Math.max(7,32-2.5*(l-1));
const slackFor=l=>Math.max(0.015,0.05-0.005*(l-1));
function startLevel(){
  stopTimer();phase='wait';cleared=false;poly=null;circles=[];draw();
  $('lv').textContent=`Level ${level}`;toast(`Level ${level}`);$('tt').textContent='';$('tfill').style.width='100%';
  setTimeout(()=>{
    do{poly=randomShape(level);}while(!prepare(slackFor(level)));
    draw();
    setTimeout(()=>{
      $('toast').classList.remove('show');
      limit=timeFor(level);deadline=performance.now()+limit*1000;phase='play';
      timerId=setInterval(tick,50);tick();
    },600);
  },60);
}
function tick(){
  const left=Math.max(0,deadline-performance.now());
  $('tt').textContent=(left/1000).toFixed(1)+'s';
  $('tfill').style.width=(left/(limit*1000)*100)+'%';
  if(left<=0&&phase==='play')gameOver();
}
function levelClear(){
  cleared=true;stopTimer();phase='wait';score=level;
  toast('Cleared',700);level++;
  setTimeout(startLevel,900);
}
function gameOver(){
  stopTimer();phase='over';drag=null;
  const nb=score>best();if(nb)setBest(score);
  $('overTxt').innerHTML=`Levels cleared: ${score}<br>Best: ${Math.max(score,best())}`+(nb&&score>0?'<br>New record':'');
  toast('Here is a solution',1600);
  slideToSolved(()=>show('over',true));
}

/* ---- solve (free / zen) ---- */
const perms=[[0,1,2],[0,2,1],[1,0,2],[1,2,0],[2,0,1],[2,1,0]];
function slideToSolved(done){
  let bp=null,bd=1e18;
  for(const pm of perms){let t=0;for(let i=0;i<3;i++)t+=d2(circles[i],solved[pm[i]]);if(t<bd){bd=t;bp=pm}}
  const from=circles.map(c=>({x:c.x,y:c.y})),to=bp.map(i=>solved[i]);
  const t0=performance.now(),D=900;
  anim=true;
  (function step(t){
    let u=Math.min(1,(t-t0)/D);u=1-Math.pow(1-u,3);
    circles.forEach((c,i)=>{c.x=from[i].x+(to[i].x-from[i].x)*u;c.y=from[i].y+(to[i].y-from[i].y)*u;});
    draw();
    if(t-t0<D)requestAnimationFrame(step);else{anim=null;if(done)done();}
  })(t0);
}
$('bSolve').onclick=()=>{
  if(!solved||anim||phase!=='play')return;
  slideToSolved();
};

/* ================= render ================= */
function info(t){const h=$('hint');h.textContent=t;h.classList.toggle('hidden',!t);}
const rgba=(h,a)=>{h=h.replace('#','');if(h.length===3)h=h.replace(/./g,'$&$&');return `rgba(${parseInt(h.slice(0,2),16)},${parseInt(h.slice(2,4),16)},${parseInt(h.slice(4,6),16)},${a})`};
const FG=()=>getComputedStyle(document.documentElement).getPropertyValue('--fg').trim()||'#222';
const ACC=()=>getComputedStyle(document.documentElement).getPropertyValue('--acc').trim()||'#4f46e5';
function path(c,P,close){c.beginPath();P.forEach((p,i)=>i?c.lineTo(p.x,p.y):c.moveTo(p.x,p.y));if(close)c.closePath();}
function draw(){
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
  if(!poly){
    if(stroke.length&&phase==='draw'){ctx.strokeStyle=ACC();ctx.lineWidth=3;ctx.lineJoin='round';ctx.lineCap='round';path(ctx,stroke,false);ctx.stroke();
      ctx.setLineDash([5,5]);ctx.globalAlpha=.5;ctx.beginPath();ctx.moveTo(stroke[stroke.length-1].x,stroke[stroke.length-1].y);ctx.lineTo(stroke[0].x,stroke[0].y);ctx.stroke();ctx.setLineDash([]);ctx.globalAlpha=1;}
    return;
  }
  mctx.setTransform(dpr,0,0,dpr,0,0);mctx.clearRect(0,0,W,H);
  mctx.globalCompositeOperation='source-over';mctx.fillStyle=rgba(ACC(),.85);
  path(mctx,poly,true);mctx.fill('evenodd');
  mctx.globalCompositeOperation='destination-out';mctx.fillStyle='#000';
  for(const c of circles){mctx.beginPath();mctx.arc(c.x,c.y,R,0,7);mctx.fill();}
  ctx.setTransform(1,0,0,1,0,0);ctx.drawImage(mask,0,0);ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.save();path(ctx,poly,true);ctx.clip('evenodd');
  ctx.fillStyle=rgba(ACC(),.2);
  for(const c of circles){ctx.beginPath();ctx.arc(c.x,c.y,R,0,7);ctx.fill();}
  ctx.restore();
  circles.forEach((c,i)=>{
    ctx.beginPath();ctx.arc(c.x,c.y,R,0,7);ctx.strokeStyle=ACC();ctx.lineWidth=2.5;ctx.stroke();
    ctx.beginPath();ctx.arc(c.x,c.y,3,0,7);ctx.fillStyle=ctx.strokeStyle;ctx.fill();
  });
  if(phase==='draw')return;
  const un=uncoveredPx(circles,R);
  const pu=un>0?Math.max(0.1,un/totalPx*100):0;
  info('');show('stats',true);
  $('cov').textContent=`${(100-pu).toFixed(1)}% covered`;$('cov').classList.toggle('ok',un===0);
  $('rad').textContent=`r = ${R.toFixed(1)}px`;
  if(mode==='rush'&&phase==='play'&&un===0&&!cleared&&!anim)levelClear();
}
openMenu();
resize();
addEventListener('load',resize);
if(window.ResizeObserver)new ResizeObserver(resize).observe(document.getElementById('wrap'));
</script>
</body>
</html>
